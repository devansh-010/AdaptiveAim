<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Metallic Gradients -->
    <linearGradient id="gunBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#161e31" />
      <stop offset="70%" stop-color="#232f48" />
      <stop offset="100%" stop-color="#3b4d71" />
    </linearGradient>

    <linearGradient id="gunSlide" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="gloveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <linearGradient id="glovePad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group rotated & positioned for FPS bottom-right view -->
  <g id="weapon-assembly">
    <!-- Forearm / Arm Extension -->
    <path d="M 220 400 L 400 400 L 400 260 L 320 230 Z" fill="url(#gloveGrad)" />

    <!-- Tactical Glove Hand & Wrist -->
    <path d="M 200 370 C 230 330, 270 300, 310 270 L 370 330 L 300 400 Z" fill="url(#gloveGrad)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Glove Knuckle Padding / Armor Plate -->
    <path d="M 230 330 L 275 285 L 300 305 L 255 350 Z" fill="url(#glovePad)" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Thumb holding side grip -->
    <path d="M 215 300 C 205 280, 210 260, 230 250 C 240 255, 245 270, 240 290 Z" fill="url(#gloveGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Gun Grip (Under Hand) -->
    <path d="M 210 260 L 260 210 L 295 245 L 245 295 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- Main Gun Chassis / Frame -->
    <path d="M 120 170 L 260 30 L 300 70 L 250 170 L 220 250 L 170 210 Z" fill="url(#gunBody)" stroke="#475569" stroke-width="2" />

    <!-- Top Slide Barrel Assembly (pointing up-left) -->
    <path d="M 90 140 L 230 0 L 270 40 L 130 180 Z" fill="url(#gunSlide)" stroke="#64748b" stroke-width="2" />

    <!-- Barrel Tip / Muzzle Port -->
    <polygon points="90,140 70,120 100,90 120,110" fill="#090d16" stroke="#00e5ff" stroke-width="2" />
    <circle cx="85" cy="125" r="8" fill="#030712" stroke="#00ffff" stroke-width="1.5" filter="url(#neonGlow)" />

    <!-- Cyan High-Tech Energy Strip on Slide -->
    <path d="M 125 125 L 225 25 L 235 35 L 135 135 Z" fill="url(#cyanGlowGrad)" filter="url(#neonGlow)" />

    <!-- Serrations / Vents on Slide -->
    <line x1="160" y1="70" x2="175" y2="85" stroke="#0f172a" stroke-width="3" />
    <line x1="175" y1="55" x2="190" y2="70" stroke="#0f172a" stroke-width="3" />
    <line x1="190" y1="40" x2="205" y2="55" stroke="#0f172a" stroke-width="3" />

    <!-- Trigger Guard -->
    <path d="M 170 210 Q 140 200 160 170" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <!-- Trigger -->
    <path d="M 175 190 Q 165 185 170 175" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Index Finger Wrap (on Trigger/Guard) -->
    <path d="M 155 185 C 150 175, 160 165, 175 170 C 185 175, 185 190, 170 195 Z" fill="url(#gloveGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Modern Sight Front & Rear Alignment Pins -->
    <polygon points="80,115 73,108 82,99 89,106" fill="#00ffff" filter="url(#neonGlow)" />
    <polygon points="215,20 208,13 217,4 224,11" fill="#00ffff" filter="url(#neonGlow)" />
  </g>
</svg>
